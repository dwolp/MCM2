[package]
name = "mm2-launcher"
description = "Sets up OpenMCM2 from your own Motocross Madness 2 and starts it"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_material_icons = "0.9"
flate2 = "1.1.10"
mm2-settings = { version = "0.2.1", path = "../mm2-settings" }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shadcn-egui-font-inter = "0.8"
tar = "0.4.46"
ureq = "3"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.31"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
